<title>職安衛練習題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #eceff3;
    --text: #1b1f27;
    --muted: #59626f;
    --border: #e0e4ea;
    --accent: #3b5bdb;
    --accent-ink: #ffffff;
    --good: #2f9e44;
    --good-bg: #e6f4ea;
    --good-ink: #1b5e2a;
    --bad: #e03131;
    --bad-bg: #fdeceb;
    --bad-ink: #8f2020;
    --warn: #d9770a;
    --warn-bg: #fdf1e0;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(20, 26, 40, .06), 0 8px 24px rgba(20, 26, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11141a;
      --surface: #1a1e26;
      --surface-2: #232833;
      --text: #e7eaf0;
      --muted: #98a2b1;
      --border: #2b313c;
      --accent: #6a8bff;
      --accent-ink: #0a0c11;
      --good: #55c96a;
      --good-bg: #16301e;
      --good-ink: #a8e6b4;
      --bad: #ff6b6b;
      --bad-bg: #331a1a;
      --bad-ink: #ffc3c3;
      --warn: #f0a94c;
      --warn-bg: #322512;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #11141a;
    --surface: #1a1e26;
    --surface-2: #232833;
    --text: #e7eaf0;
    --muted: #98a2b1;
    --border: #2b313c;
    --accent: #6a8bff;
    --accent-ink: #0a0c11;
    --good: #55c96a;
    --good-bg: #16301e;
    --good-ink: #a8e6b4;
    --bad: #ff6b6b;
    --bad-bg: #331a1a;
    --bad-ink: #ffc3c3;
    --warn: #f0a94c;
    --warn-bg: #322512;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .3);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .wrap {
    width: 100%;
    max-width: 600px;
    padding: 18px 16px 96px;
  }

  h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -.01em; margin: 0 0 4px; text-wrap: balance; }
  h2 { font-size: 1.05rem; font-weight: 700; margin: 0 0 12px; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: .875rem; }
  .tnum { font-variant-numeric: tabular-nums; }

  .stack { display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
  }
  .card.flat { box-shadow: none; }
  .card.accent { border-color: var(--accent); }

  .btn {
    -webkit-appearance: none; appearance: none;
    font: inherit;
    width: 100%;
    min-height: 48px;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: border-color .15s, background .15s, transform .05s;
  }
  .btn:hover { border-color: var(--muted); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
  .btn.primary:hover { filter: brightness(1.05); border-color: var(--accent); }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 40px; padding: 8px 12px; font-size: .9rem; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { width: auto; flex: 1; }

  .pbar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .pbar > i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }

  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0 12px;
    background: var(--bg);
  }
  .topbar .grow { flex: 1; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--surface-2); border-radius: 10px; padding: 12px 8px; text-align: center; }
  .stat b { display: block; font-size: 1.35rem; font-weight: 700; }
  .stat span { font-size: .78rem; color: var(--muted); }

  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 9px; border-radius: 999px;
    font-size: .76rem; font-weight: 500;
    background: var(--surface-2); color: var(--muted);
  }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.good { background: var(--good-bg); color: var(--good-ink); }
  .chip.bad { background: var(--bad-bg); color: var(--bad-ink); }

  .qstem { font-size: 1.12rem; font-weight: 500; line-height: 1.55; margin: 10px 0 16px; text-wrap: pretty; }

  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: flex-start; gap: 12px;
    width: 100%; min-height: 52px;
    padding: 13px 14px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface);
    color: var(--text); font: inherit; text-align: left; line-height: 1.5;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:hover:not([disabled]) { border-color: var(--accent); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt[disabled] { cursor: default; }
  .opt .mk {
    flex: none;
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: .85rem; font-weight: 700;
    background: var(--surface-2); color: var(--muted);
  }
  .opt.correct { border-color: var(--good); background: var(--good-bg); }
  .opt.correct .mk { background: var(--good); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.wrong .mk { background: var(--bad); color: #fff; }
  .opt.correct .tag { color: var(--good-ink); font-weight: 700; margin-left: auto; }
  .opt.wrong .tag { color: var(--bad-ink); font-weight: 700; margin-left: auto; }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field + .field { margin-top: 15px; }
  .field > .lbl { font-weight: 500; font-size: .92rem; }
  .field .hint { font-size: .8rem; color: var(--muted); }
  select, input[type="file"] {
    font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 10px; min-height: 42px; width: 100%;
  }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .radios { display: flex; gap: 8px; flex-wrap: wrap; }
  .radios label {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border: 1px solid var(--border); border-radius: 999px;
    font-size: .9rem; cursor: pointer;
  }
  .radios input { accent-color: var(--accent); }
  .radios label:has(input:checked) { border-color: var(--accent); color: var(--accent); font-weight: 500; }
  .checks {
    display: flex; flex-direction: column; gap: 4px;
    max-height: 220px; overflow: auto;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px;
  }
  .checks label { display: flex; align-items: center; gap: 8px; font-size: .9rem; padding: 4px 2px; cursor: pointer; }
  .checks input { accent-color: var(--accent); }
  .optrow { display: flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; }
  .optrow input { accent-color: var(--accent); flex: none; }

  .toggle {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; min-height: 36px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    font: inherit; font-size: .85rem; cursor: pointer;
  }
  .toggle[aria-pressed="true"] { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); font-weight: 600; }
  .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  details { border-top: 1px solid var(--border); padding-top: 12px; }
  summary { cursor: pointer; font-weight: 500; font-size: .92rem; }
  details .body { margin-top: 10px; font-size: .875rem; color: var(--muted); }
  details code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: .85em; }

  .wronglist { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .wrongitem { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: .9rem; }
  .wrongitem .meta { font-size: .76rem; color: var(--muted); margin-bottom: 3px; }

  .banner {
    background: var(--warn-bg); color: var(--warn);
    border: 1px solid var(--warn); border-radius: 8px;
    padding: 10px 12px; font-size: .85rem; margin-bottom: 14px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 999px; font-size: .875rem;
    box-shadow: var(--shadow); z-index: 50;
    opacity: 0; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  textarea {
    width: 100%; min-height: 140px; font-family: ui-monospace, Menlo, monospace;
    font-size: .8rem; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--text); padding: 10px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

/* ---------- 基本索引 ---------- */
const BANK = new Map(QUESTIONS.map(q => [q.id, q]));
const MK = ["一", "二", "三", "四"];
const KEY = "exam-quiz.v1";

const SECTIONS = (() => {
  const m = new Map();
  for (const q of QUESTIONS) {
    if (!m.has(q.section)) {
      m.set(q.section, { key: q.section, subject: q.subject, subjectCode: q.subjectCode, sectionNum: q.sectionNum, title: q.section, count: 0 });
    }
    m.get(q.section).count++;
  }
  return [...m.values()].sort((a, b) => a.subjectCode.localeCompare(b.subjectCode) || a.sectionNum - b.sectionNum);
})();
const SUBJECTS = (() => {
  const m = new Map();
  for (const q of QUESTIONS) {
    if (!m.has(q.subjectCode)) m.set(q.subjectCode, { code: q.subjectCode, name: q.subject, count: 0 });
    m.get(q.subjectCode).count++;
  }
  return [...m.values()];
})();

/* ---------- 儲存 ---------- */
let lsOK = true;
function defaultStore() { return { version: 1, progress: {}, session: null, settingsLastUsed: null, updatedAt: null }; }
function loadStore() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaultStore();
    const s = JSON.parse(raw);
    if (!s || s.version !== 1) return defaultStore();
    s.progress = s.progress || {};
    return s;
  } catch (e) { lsOK = false; return defaultStore(); }
}
function saveStore() {
  store.updatedAt = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(store)); }
  catch (e) { lsOK = false; }
}
let store = loadStore();

const EMPTY_PROG = { seen: 0, correctCount: 0, wrongCount: 0, consecutiveCorrect: 0, lastResult: null, unsure: false, unsureEver: false, lastAnsweredAt: null };
function progOf(id) { return store.progress[id] || { ...EMPTY_PROG }; }

/* ---------- 選題 ---------- */
function priority(p) {
  return 3 * p.wrongCount
    + 2 * (p.lastResult === "wrong" ? 1 : 0)
    + 2 * (p.unsureEver ? 1 : 0)
    + 1 * (p.seen === 0 ? 1 : 0)
    - 1 * p.consecutiveCorrect;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function selectQuestions(s) {
  let list = QUESTIONS.slice();
  if (s.scopeMode === "subject") list = list.filter(q => s.subjects.includes(q.subjectCode));
  else if (s.scopeMode === "section") list = list.filter(q => s.sections.includes(q.section));

  list = list.filter(q => {
    const p = progOf(q.id);
    switch (s.source) {
      case "unseen": return p.seen === 0;
      case "wrong": return p.wrongCount >= 1;
      case "unsure": return p.unsureEver;
      case "wrong_or_unsure": return p.wrongCount >= 1 || p.unsureEver;
      case "wrongN": return p.wrongCount >= s.wrongN;
      case "last_wrong": return p.lastResult === "wrong";
      default: return true;
    }
  });
  if (s.hideMastered) list = list.filter(q => {
    const p = progOf(q.id);
    return !(p.consecutiveCorrect >= 2 && !p.unsure);
  });

  if (s.order === "random") shuffle(list);
  else if (s.order === "priority") {
    shuffle(list);
    list.sort((a, b) => priority(progOf(b.id)) - priority(progOf(a.id)));
  } else {
    list.sort((a, b) => a.subjectCode.localeCompare(b.subjectCode) || a.sectionNum - b.sectionNum || a.num - b.num);
  }
  if (s.limit > 0) list = list.slice(0, s.limit);
  return list.map(q => q.id);
}

/* ---------- 練習流程 ---------- */
let feedback = null; // {choice, correct} 作答後暫存

function beginQueue(ids, settings) {
  if (!ids.length) { toast("符合條件的題目是 0 題"); return; }
  store.session = { queue: ids, pos: 0, answers: [], settings: settings || null, startedAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
  store.settingsLastUsed = settings || store.settingsLastUsed;
  feedback = null;
  saveStore();
  go("practice");
}
function currentQ() {
  const s = store.session;
  return s && s.pos < s.queue.length ? BANK.get(s.queue[s.pos]) : null;
}
let curUnsure = false;

function answer(choice) {
  const q = currentQ();
  if (!q || feedback) return;
  const correct = (choice + 1) === q.answer;
  const p = { ...EMPTY_PROG, ...progOf(q.id) };
  p.seen++;
  if (correct) { p.correctCount++; p.consecutiveCorrect++; p.lastResult = "correct"; }
  else { p.wrongCount++; p.consecutiveCorrect = 0; p.lastResult = "wrong"; }
  p.unsure = curUnsure;
  if (curUnsure) p.unsureEver = true;
  p.lastAnsweredAt = new Date().toISOString();
  store.progress[q.id] = p;

  store.session.answers.push({ id: q.id, choice, correct, unsure: curUnsure });
  store.session.pos++;
  store.session.updatedAt = new Date().toISOString();
  feedback = { choice, correct };
  saveStore();
  render();
}
function nextQ() {
  feedback = null;
  const s = store.session;
  if (!s || s.pos >= s.queue.length) {
    lastSummary = summarize(s);
    store.session = null;
    saveStore();
    go("result");
    return;
  }
  render();
}
function endSession() { saveStore(); go("home"); }
function summarize(s) {
  const ans = s ? s.answers : [];
  return {
    total: ans.length,
    correct: ans.filter(a => a.correct).length,
    wrongIds: ans.filter(a => !a.correct).map(a => a.id),
  };
}
let lastSummary = null;

/* ---------- 畫面 ---------- */
let screen = "home";
function go(s) { screen = s; window.scrollTo(0, 0); render(); }
const app = () => document.getElementById("app");
function esc(x) { return String(x).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function statHome() {
  let attempted = 0, correct = 0, reviewPile = 0;
  for (const q of QUESTIONS) {
    const p = progOf(q.id);
    if (p.seen > 0) { attempted++; correct += p.correctCount; }
    if (p.wrongCount >= 1 || p.unsureEver) reviewPile++;
  }
  let totalAnswers = 0, totalCorrect = 0;
  for (const id in store.progress) { totalAnswers += store.progress[id].seen; totalCorrect += store.progress[id].correctCount; }
  const acc = totalAnswers ? Math.round(totalCorrect / totalAnswers * 100) : 0;
  return { attempted, reviewPile, acc, done: attempted, totalQ: QUESTIONS.length };
}

function renderHome() {
  const st = statHome();
  const s = store.session;
  const resumable = s && s.pos < s.queue.length;
  const last = store.settingsLastUsed;

  let html = "";
  if (!lsOK) html += `<div class="banner">此瀏覽器無法儲存進度（可能是無痕模式或封鎖了網站資料）。你仍可練習，但關掉頁面後進度不會保留。</div>`;

  html += `<div class="stack">
    <div>
      <h1>職安衛練習題</h1>
      <p class="muted">共 <span class="tnum">${st.totalQ}</span> 題 · ${SECTIONS.map(x => esc(x.title)).join("、")}</p>
    </div>`;

  if (resumable) {
    html += `<div class="card accent stack">
      <h2>繼續上次練習</h2>
      <div class="pbar"><i style="width:${Math.round(s.pos / s.queue.length * 100)}%"></i></div>
      <p class="muted">還在第 <span class="tnum">${s.pos + 1}</span> / <span class="tnum">${s.queue.length}</span> 題</p>
      <button class="btn primary" id="resume">繼續</button>
      <button class="btn ghost sm" id="dropSession">放棄這次，重新設定</button>
    </div>`;
  }

  html += `<div class="card stack">
    <h2>${resumable ? "或：開始新練習" : "開始新練習"}</h2>
    <div class="field">
      <span class="lbl">範圍</span>
      <div class="radios" id="scopeRadios">
        <label><input type="radio" name="scope" value="all" checked> 全部</label>
        <label><input type="radio" name="scope" value="subject"> 依科目</label>
        <label><input type="radio" name="scope" value="section"> 依工作項目</label>
      </div>
      <div id="scopeBox"></div>
    </div>
    <div class="field">
      <span class="lbl">出題範圍</span>
      <select id="source">
        <option value="all">全部題目</option>
        <option value="unseen">還沒做過的</option>
        <option value="wrong">答錯過的</option>
        <option value="unsure">標「沒把握」的</option>
        <option value="wrong_or_unsure">答錯過 或 沒把握的</option>
        <option value="wrongN">答錯次數達 N 次以上</option>
        <option value="last_wrong">上次作答答錯的</option>
      </select>
      <div class="field" id="wrongNBox" style="display:none">
        <select id="wrongN">
          <option value="1">答錯 ≥ 1 次</option>
          <option value="2">答錯 ≥ 2 次</option>
          <option value="3">答錯 ≥ 3 次</option>
          <option value="4">答錯 ≥ 4 次</option>
        </select>
      </div>
    </div>
    <div class="field">
      <span class="lbl">出題順序</span>
      <select id="order">
        <option value="orig">原順序</option>
        <option value="random">隨機</option>
        <option value="priority">錯最多、最不熟的優先</option>
      </select>
    </div>
    <div class="field">
      <span class="lbl">這次做幾題</span>
      <select id="limit">
        <option value="20">20 題</option>
        <option value="50" selected>50 題</option>
        <option value="100">100 題</option>
        <option value="0">全部</option>
      </select>
    </div>
    <label class="optrow"><input type="checkbox" id="hideMastered"> <span>隱藏已連續答對 2 次、且目前沒標沒把握的題</span></label>
    <button class="btn primary" id="start">開始</button>
  </div>`;

  html += `<div class="card stack">
    <h2>我的狀況</h2>
    <div class="stats">
      <div class="stat"><b class="tnum">${st.done}</b><span>做過的題</span></div>
      <div class="stat"><b class="tnum">${st.acc}%</b><span>累積正確率</span></div>
      <div class="stat"><b class="tnum">${st.reviewPile}</b><span>待複習（錯過/沒把握）</span></div>
    </div>
  </div>`;

  html += `<div class="card flat stack">
    <div class="btn-row">
      <button class="btn sm" id="expBtn">匯出進度</button>
      <button class="btn sm" id="impBtn">匯入進度</button>
    </div>
    <button class="btn ghost sm" id="clrBtn">清除本機進度</button>
    <p class="muted">進度只存在這個瀏覽器。要在另一支手機／電腦接續，用「匯出進度」存成檔案，再到另一台「匯入進度」。分享給同事：把這個網址給他，他會有自己獨立的進度。</p>
  </div>`;

  html += `<details>
    <summary>複習邏輯怎麼運作</summary>
    <div class="body">
      <p>每題會記錄：做過幾次、答錯幾次、連續答對幾次、上次對錯、有沒有標「沒把握」。</p>
      <p style="margin-top:8px">「錯最多、最不熟的優先」用這個分數由高到低排：<br>
      <code>3×答錯次數 + 2×(上次答錯) + 2×(曾標沒把握) + 1×(還沒做過) − 1×連續答對次數</code></p>
      <p style="margin-top:8px">「答錯過的」是<b>只要錯過一次就永遠算</b>，就算後來都對了也叫得出來。<br>
      「隱藏已精熟」只是暫時把連續答對 2 次以上、且目前沒標沒把握的題從這次練習排除，不會刪紀錄。</p>
    </div>
  </details>`;

  html += `</div>`;
  app().innerHTML = html;

  // wire
  if (resumable) {
    document.getElementById("resume").onclick = () => { feedback = null; go("practice"); };
    document.getElementById("dropSession").onclick = () => {
      if (confirm("放棄這次練習進度？（各題的作答紀錄會保留）")) { store.session = null; saveStore(); render(); }
    };
  }
  const scopeBox = document.getElementById("scopeBox");
  function drawScope(mode) {
    if (mode === "subject") {
      scopeBox.innerHTML = `<div class="checks" id="subjChecks">${SUBJECTS.map(x =>
        `<label><input type="checkbox" value="${esc(x.code)}" checked> ${esc(x.name)}（${x.count} 題）</label>`).join("")}</div>`;
    } else if (mode === "section") {
      scopeBox.innerHTML = `<div class="checks" id="secChecks">${SECTIONS.map(x =>
        `<label><input type="checkbox" value="${esc(x.key)}" checked> ${esc(x.title)}（${x.count} 題）</label>`).join("")}</div>`;
    } else scopeBox.innerHTML = "";
  }
  drawScope("all");
  document.querySelectorAll('input[name="scope"]').forEach(r => r.onchange = () => drawScope(document.querySelector('input[name="scope"]:checked').value));

  const sourceSel = document.getElementById("source");
  sourceSel.onchange = () => {
    document.getElementById("wrongNBox").style.display = sourceSel.value === "wrongN" ? "" : "none";
  };
  if (last) {
    if (last.source) { sourceSel.value = last.source; sourceSel.onchange(); }
    if (last.order) document.getElementById("order").value = last.order;
    if (last.limit != null) document.getElementById("limit").value = String(last.limit);
  }

  document.getElementById("start").onclick = () => {
    const scopeMode = document.querySelector('input[name="scope"]:checked').value;
    const settings = {
      scopeMode,
      subjects: scopeMode === "subject" ? [...document.querySelectorAll("#subjChecks input:checked")].map(i => i.value) : [],
      sections: scopeMode === "section" ? [...document.querySelectorAll("#secChecks input:checked")].map(i => i.value) : [],
      source: sourceSel.value,
      wrongN: parseInt(document.getElementById("wrongN").value, 10) || 1,
      order: document.getElementById("order").value,
      limit: parseInt(document.getElementById("limit").value, 10) || 0,
      hideMastered: document.getElementById("hideMastered").checked,
    };
    if (settings.scopeMode === "subject" && !settings.subjects.length) return toast("請至少勾一個科目");
    if (settings.scopeMode === "section" && !settings.sections.length) return toast("請至少勾一個工作項目");
    beginQueue(selectQuestions(settings), settings);
  };

  document.getElementById("expBtn").onclick = exportProgress;
  document.getElementById("impBtn").onclick = () => document.getElementById("importFile").click();
  document.getElementById("clrBtn").onclick = () => {
    if (confirm("清除這個瀏覽器上的所有練習進度？無法復原。")) {
      store = defaultStore(); saveStore(); toast("已清除"); render();
    }
  };
}

function renderPractice() {
  const s = store.session;
  if (!s) return go("home");
  const q = feedback ? BANK.get(s.queue[s.pos - 1]) : currentQ();
  if (!q) { lastSummary = summarize(s); store.session = null; saveStore(); return go("result"); }

  const shownIdx = feedback ? s.pos : s.pos + 1;
  const p = progOf(q.id);
  if (!feedback) curUnsure = p.unsure === true;

  let html = `<div class="topbar">
    <button class="btn ghost sm" id="quit" style="width:auto">結束並存檔</button>
    <span class="grow"></span>
    <span class="chip">${esc(q.section)}</span>
  </div>
  <div class="pbar" style="margin-bottom:14px"><i style="width:${Math.round(shownIdx / s.queue.length * 100)}%"></i></div>
  <p class="muted tnum" style="margin-bottom:6px">第 ${shownIdx} / ${s.queue.length} 題　·　題庫編號 ${q.num}</p>`;

  html += `<div class="card">
    <div style="display:flex;justify-content:flex-end">
      <button class="toggle" id="unsure" aria-pressed="${curUnsure}">⚑ 沒把握</button>
    </div>
    <p class="qstem">${esc(q.stem)}</p>
    <div class="opts">`;
  for (let i = 0; i < 4; i++) {
    let cls = "opt";
    let tag = "";
    if (feedback) {
      if (i + 1 === q.answer) { cls += " correct"; tag = `<span class="tag">正解</span>`; }
      else if (i === feedback.choice) { cls += " wrong"; tag = `<span class="tag">你選的</span>`; }
    }
    html += `<button class="${cls}" data-i="${i}" ${feedback ? "disabled" : ""}>
      <span class="mk">${MK[i]}</span><span>${esc(q.options[i])}</span>${tag}</button>`;
  }
  html += `</div>`;

  if (feedback) {
    const msg = feedback.correct
      ? `<span class="chip good">✓ 答對</span>`
      : `<span class="chip bad">✗ 答錯</span>`;
    const uns = curUnsure ? ` <span class="chip warn">已標沒把握</span>` : "";
    const done = s.pos >= s.queue.length;
    html += `<div style="margin-top:16px;display:flex;align-items:center;gap:8px">${msg}${uns}</div>
      <button class="btn primary" id="next" style="margin-top:14px">${done ? "完成，看結果" : "下一題"}</button>`;
  }
  html += `</div>`;
  app().innerHTML = html;

  document.getElementById("quit").onclick = endSession;
  const ub = document.getElementById("unsure");
  ub.onclick = () => {
    curUnsure = ub.getAttribute("aria-pressed") !== "true";
    ub.setAttribute("aria-pressed", String(curUnsure));
    if (feedback && store.progress[q.id]) {
      store.progress[q.id].unsure = curUnsure;
      if (curUnsure) store.progress[q.id].unsureEver = true;
      saveStore();
    }
  };
  if (feedback) {
    const nb = document.getElementById("next");
    nb.onclick = nextQ;
    nb.focus();
  } else {
    app().querySelectorAll(".opt").forEach(b => b.onclick = () => answer(parseInt(b.dataset.i, 10)));
  }
}

function renderResult() {
  const r = lastSummary || { total: 0, correct: 0, wrongIds: [] };
  const acc = r.total ? Math.round(r.correct / r.total * 100) : 0;
  let html = `<div class="stack">
    <h1>這次練習結果</h1>
    <div class="stats">
      <div class="stat"><b class="tnum">${r.total}</b><span>作答題數</span></div>
      <div class="stat"><b class="tnum">${r.correct}</b><span>答對</span></div>
      <div class="stat"><b class="tnum">${acc}%</b><span>正確率</span></div>
    </div>`;

  if (r.wrongIds.length) {
    html += `<div class="card stack">
      <h2>這次答錯的 ${r.wrongIds.length} 題</h2>
      <div class="wronglist">${r.wrongIds.map(id => {
        const q = BANK.get(id);
        return `<div class="wrongitem"><div class="meta">${esc(q.section)} · 題庫編號 ${q.num}</div>${esc(q.stem)}</div>`;
      }).join("")}</div>
      <button class="btn primary" id="reviewWrong">立即複習這 ${r.wrongIds.length} 題</button>
    </div>`;
  } else {
    html += `<div class="card"><p>全部答對，讚。</p></div>`;
  }
  html += `<button class="btn" id="backHome">回首頁</button></div>`;
  app().innerHTML = html;

  if (r.wrongIds.length) document.getElementById("reviewWrong").onclick = () => beginQueue(r.wrongIds.slice(), store.settingsLastUsed);
  document.getElementById("backHome").onclick = () => go("home");
}

function render() {
  if (screen === "practice") renderPractice();
  else if (screen === "result") renderResult();
  else renderHome();
}

/* ---------- 匯出／匯入 ---------- */
function todayStr() { return new Date().toISOString().slice(0, 10).replace(/-/g, ""); }
async function exportProgress() {
  const data = JSON.stringify(store, null, 2);
  const filename = `exam-progress-${todayStr()}.json`;
  const c = (typeof claude !== "undefined") ? claude : (typeof window !== "undefined" ? window.claude : undefined);
  if (c && typeof c.use === "function") {
    try {
      const dl = await c.use("downloads");
      if (dl) { await dl.save({ filename, data }); toast("已匯出"); return; }
    } catch (e) {
      if (e && e.code === "declined") return;
      // 其他錯誤 -> 走 fallback
    }
  }
  showExportFallback(data, filename);
}
function showExportFallback(data, filename) {
  const html = `<div class="stack">
    <h1>匯出進度</h1>
    <p class="muted">這個環境無法直接下載檔案。請全選下面的文字，貼進一個檔案存成 <code>${esc(filename)}</code>（副檔名 .json）。</p>
    <textarea readonly id="expText">${esc(data)}</textarea>
    <button class="btn" id="copyExp">全選並複製</button>
    <button class="btn ghost" id="backHome2">回首頁</button>
  </div>`;
  app().innerHTML = html;
  document.getElementById("copyExp").onclick = async () => {
    const t = document.getElementById("expText");
    t.select();
    try { await navigator.clipboard.writeText(data); toast("已複製"); }
    catch (e) { document.execCommand("copy"); toast("已複製"); }
  };
  document.getElementById("backHome2").onclick = () => go("home");
}
function mergeProgress(incoming) {
  const inc = (incoming && incoming.progress) || {};
  for (const id in inc) {
    const b = inc[id];
    const a = store.progress[id];
    if (!a) { store.progress[id] = { ...EMPTY_PROG, ...b }; continue; }
    const bNewer = (b.lastAnsweredAt || "") > (a.lastAnsweredAt || "");
    store.progress[id] = {
      seen: Math.max(a.seen || 0, b.seen || 0),
      correctCount: Math.max(a.correctCount || 0, b.correctCount || 0),
      wrongCount: Math.max(a.wrongCount || 0, b.wrongCount || 0),
      consecutiveCorrect: bNewer ? (b.consecutiveCorrect || 0) : (a.consecutiveCorrect || 0),
      lastResult: bNewer ? b.lastResult : a.lastResult,
      unsure: bNewer ? !!b.unsure : !!a.unsure,
      unsureEver: !!a.unsureEver || !!b.unsureEver,
      lastAnsweredAt: bNewer ? b.lastAnsweredAt : a.lastAnsweredAt,
    };
  }
}
document.getElementById("importFile").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); }
    catch (e) { toast("檔案格式不對，不是有效的 JSON"); return; }
    if (!parsed || typeof parsed !== "object" || !parsed.progress) { toast("這個檔案裡沒有進度資料"); return; }
    const n = Object.keys(parsed.progress).length;
    const replace = confirm(`匯入 ${n} 題的紀錄。\n\n按「確定」＝與現有進度合併（各項取較高值）\n按「取消」＝改為完全覆蓋現有進度`);
    if (replace) mergeProgress(parsed);
    else { parsed.session = store.session; store = { ...defaultStore(), ...parsed, progress: parsed.progress }; }
    saveStore();
    toast("已匯入");
    go("home");
  };
  reader.readAsText(f);
  ev.target.value = "";
});

/* ---------- toast ---------- */
let toastT = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ---------- 啟動 ---------- */
render();
</script>
